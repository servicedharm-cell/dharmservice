<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHARM SERVICE Admin</title><style>
body{margin:0;background:#f4f6f8;font-family:Arial;color:#172033}.wrap{max-width:760px;margin:auto;padding:18px}header{background:#0b1f3a;color:white;padding:18px;border-radius:16px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 12px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd3dd;border-radius:9px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#0b1f3a;color:#fff;font-weight:bold;margin-top:8px}.rate{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:center;margin:8px 0}.hidden{display:none}.ok{color:green}.err{color:#b42318}</style></head><body><div class="wrap"><header><h1>⚙️ DHARM SERVICE Admin</h1><div>Vegetable Rate Update System</div></header>
<div id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="msg"></p></div>
<div id="panel" class="card hidden"><h2>आज की Rate Update करें</h2><div id="list"></div><button id="saveBtn">💾 Save All Rates</button><button id="logoutBtn">Logout</button><p id="status"></p></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={"apiKey": "AIzaSyCBnBNT3q1ZUNNGcCzvzRU7-qXSJlW1fxM", "authDomain": "dharm-service.firebaseapp.com", "projectId": "dharm-service", "storageBucket": "dharm-service.firebasestorage.app", "messagingSenderId": "140320632836", "appId": "1:140320632836:web:2cdba441c45ded4db54551", "measurementId": "G-1XQ434KZ0P"};const defaults=[{"name": "आलू", "price": "₹15/kg"}, {"name": "आदी", "price": "₹100/kg"}, {"name": "परवल", "price": "₹50/kg"}, {"name": "बैंगन", "price": "₹30/kg"}, {"name": "करेला", "price": "₹40/kg"}, {"name": "घीरा", "price": "₹20/kg"}, {"name": "झिंगली", "price": "₹20/kg"}, {"name": "कद्दू", "price": "₹20/kg"}, {"name": "साग", "price": "₹15/kg"}, {"name": "फूल गोभी", "price": "₹50/kg"}, {"name": "कुजरी", "price": "₹20/kg"}, {"name": "धनिया", "price": "₹120/kg"}, {"name": "बरबटी", "price": "₹25/kg"}, {"name": "भिंडी", "price": "₹15/kg"}, {"name": "मिर्च", "price": "₹100/kg"}, {"name": "बुलेट मिर्च", "price": "₹120/kg"}, {"name": "खीरा", "price": "₹50/kg"}, {"name": "बंदा गोभी", "price": "₹40/kg"}, {"name": "कदिमा", "price": "₹25/kg"}, {"name": "चथाला", "price": "₹100/kg"}, {"name": "मुठिया केला", "price": "₹60/12 पीस"}, {"name": "मूली", "price": "₹40/kg"}, {"name": "ओल", "price": "₹50/kg"}, {"name": "शिमला मिर्च", "price": "₹150/500g"}, {"name": "टमाटर", "price": "₹60/kg"}, {"name": "हरा पपीता", "price": "₹30/kg"}];const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const login=document.getElementById("login"),panel=document.getElementById("panel"),list=document.getElementById("list");
function render(data){list.innerHTML=data.map((r,i)=>`<div class="rate"><b>${r.name}</b><input data-i="${i}" value="${r.price}"></div>`).join("")}
render(defaults);
loginBtn.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(e){msg.className="err";msg.textContent="Login failed"}};
onAuthStateChanged(auth,async user=>{if(!user){login.classList.remove("hidden");panel.classList.add("hidden");return}login.classList.add("hidden");panel.classList.remove("hidden");try{const s=await getDocs(collection(db,"vegetableRates"));const data=defaults.map(x=>({...x}));s.forEach(d=>{const x=d.data(),i=data.findIndex(r=>r.name===x.name);if(i>=0)data[i].price=x.price});render(data)}catch(e){}});
saveBtn.onclick=async()=>{status.textContent="Saving...";try{for(const el of document.querySelectorAll("[data-i]")){const i=+el.dataset.i;await setDoc(doc(db,"vegetableRates",String(i+1)),{name:defaults[i].name,price:el.value,updatedAt:new Date().toISOString()})}status.className="ok";status.textContent="✅ सभी rates save हो गए।"}catch(e){status.className="err";status.textContent="❌ Save error: "+e.message}};
logoutBtn.onclick=()=>signOut(auth);
</script></body></html>
